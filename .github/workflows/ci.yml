name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dbus-next para los tests
        run: python -m pip install dbus-next==0.2.3

      - name: Tests del protocolo
        run: |
          python tests/test_protocol.py
          python tests/test_device.py

      - name: Comprobar que la versión del tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "El tag ($TAG) no coincide con package.json ($PKG)"; exit 1
          fi

      - name: Empaquetar
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-ear-deck
          path: release/nothing-ear-deck.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/nothing-ear-deck.zip
          generate_release_notes: true
